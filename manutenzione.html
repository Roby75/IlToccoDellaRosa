<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sito in manutenzione · Il Tocco della Rosa</title>
<meta name="robots" content="noindex">
<meta name="description" content="Il sito dell'allevamento di Chihuahua Il Tocco della Rosa è in manutenzione. Torniamo presto.">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1316">
<link rel="stylesheet" href="assets/style.css">
<style>
  .manutenzione{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center}
  .manutenzione .stack{max-width:42rem;width:100%;justify-items:stretch;gap:1.2rem}
  .manutenzione .logo-grande{justify-self:center;width:min(30rem,88vw);height:auto}
  .manutenzione .stack p,.manutenzione .stack h1{min-width:0}
  .manutenzione h1 em{font-style:italic;font-weight:500;color:var(--rosa)}
  .manutenzione .azioni{justify-content:center}
</style>
</head>
<body>
<main>
<section class="manutenzione">
  <div class="wrap stack">
    <img class="logo-grande" src="assets/img/logo.png" alt="Il Tocco della Rosa – Chihuahuas short &amp; long hair" width="900" height="667">
    <p class="eyebrow">Il Tocco della Rosa · Allevamento Chihuahua · Verona</p>
    <h1>Stiamo sistemando <em>il giardino</em></h1>
    <p class="lead">Il sito è in manutenzione per qualche aggiornamento e tornerà online a breve. Nel frattempo puoi scriverci su WhatsApp: ti rispondiamo come sempre.</p>
    <p><strong data-wa-numero></strong></p>
    <div class="azioni">
      <a class="btn wa" data-wa="Ciao, ho visto che il sito è in manutenzione: vorrei qualche informazione" href="https://www.facebook.com/iltoccodellarosa/">Scrivici su WhatsApp</a>
      <a class="btn" href="https://www.facebook.com/iltoccodellarosa/" target="_blank" rel="noopener">Pagina Facebook</a>
    </div>
  </div>
</section>
</main>
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
