<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prova modulo · Il Tocco della Rosa</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main><section class="sezione"><div class="wrap" style="max-width:36rem">
  <h1>Prova del modulo</h1>
  <p class="muted">Pagina temporanea per verificare che i messaggi arrivino via email. Verrà tolta dopo il test.</p>
  <form class="modulo" id="f">
    <div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" required value="Prova dal sito"></div>
    <div class="campo"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div class="campo"><label for="messaggio">Messaggio</label><textarea id="messaggio" name="messaggio" required>Messaggio di prova del modulo contatti.</textarea></div>
    <button class="btn" type="submit">Invia prova</button>
    <p id="esito" class="esito" hidden></p>
  </form>
</div></section></main>
<script src="assets/config.js"></script>
<script>
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var d = new FormData(e.target), out = document.getElementById("esito");
  d.append("access_key", window.SITO.web3formsKey);
  d.append("subject", "PROVA modulo sito – " + d.get("nome"));
  d.append("from_name", "Sito Il Tocco della Rosa");
  out.hidden = false; out.textContent = "Invio in corso…";
  fetch("https://api.web3forms.com/submit", { method: "POST", body: d })
    .then(function (r) { return r.json(); })
    .then(function (j) { out.textContent = j.success ? "Inviato! Controlla la casella info@iltoccodellarosa.it (anche lo spam)." : "Errore dal servizio: " + j.message; })
    .catch(function (err) { out.textContent = "Errore di rete: " + err; });
});
</script>
</body>
</html>
